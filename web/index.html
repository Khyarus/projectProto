<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Protogen</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <canvas id="visor"></canvas>

  <header id="hud">
    <span id="hud-state">SYS · BOOT</span>
    <span id="hud-brain"></span>
  </header>

  <div id="subtitle" aria-live="polite"></div>

  <form id="cli" autocomplete="off">
    <span class="prompt">&gt;</span>
    <input id="cli-input" type="text" spellcheck="false" placeholder="fale comigo  ·  /ajuda">
    <button id="mic" type="button" aria-label="Microfone">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
        <rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M5 11a7 7 0 0 0 14 0M12 18v3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </form>

  <script src="vendor/samjs.min.js"></script>
  <script src="js/ptsam.js"></script>
  <script src="js/eyes.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/ears.js"></script>
  <script src="js/brain.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
